<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    
  <form action="index.php" method="post" enctype="multipart/form-data">

<!--USERNAME-->  
    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="username" minlength="5" maxlength="10"><br>
    
<!--Password-->
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="password"  minlength="5" maxlength="10"><br>

<!--Email-->
    <label for="email">Email:</label>
    <input type="email" id = "email" placeholder="Email"><br>

<!--PHONE#-->
    <label for="phone">Phone #:</label>
    <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

<!--Date-->
    <label for="bday">Birthdate:</label>
    <input type="date" id="bday"><br>

<!-- Number -->
    <label for="quantity">quantity</label>
    <input type="number" id="quantity" min="0" max="10"><br>

<!--Radio Button-->
    <label for="title">title:</label>

      <label for="MR.">MR.</label>
      <input type="radio" id="MR." name="title">
        <label for="MS.">MS.</label>
         <input type="radio" id="MS."name="title">
          <label for="PHD">PHD</label>
           <input type="radio" id="PHD"name="title"><br>

<!--dropdown menu-->
    <label for="payment">payment</label>

    <select name="payment" id="payment">
        <option value="visa">visa</option>
        <option value="Mastercard">Mastercard</option>
        <option value="giftcard">giftcard</option>
    </select><br>

<!--Checkbox-->
    <label for="checkbox">Subscribe</label>
    <input type="checkbox" id="checkbox"><br>

<!--Comment-->
    <label for="comment">Comment</label>
    <textarea  id="comment" row="3" cols="25"></textarea><br>

<!--file-->
    <label for="file">file</label>
    <input type="file" id="file" accept="image/png, image/jpeg"><br>
    
    <input type="reset"><br>
    <input type="submit"> 
   


  </form>
</body>
</html>
